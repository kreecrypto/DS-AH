name: AHDS Docs CI

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - "package.json"
      - ".github/workflows/docs-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "package.json"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run validate:docs
