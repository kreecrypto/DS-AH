<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AH Design System — foundations, components, patterns, Figma mapping, and agent governance." />
    <meta name="theme-color" content="#0b2e59" />
    <title>AH Design System</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="global-header">
      <a class="brand" href="#/overview" aria-label="AH Design System home">
        <span class="brand-mark" aria-hidden="true">AH</span>
        <span><strong>AH Design System</strong><small>AdvisorHub</small></span>
      </a>
      <button class="search-trigger" id="searchTrigger" type="button" aria-haspopup="dialog">
        <span aria-hidden="true">⌕</span><span>Search the system</span><kbd>⌘ K</kbd>
      </button>
      <nav class="utility-nav" aria-label="Utility">
        <a href="#/figma">Figma</a><a href="#/agent">Agent</a><span class="version">v2.4</span>
      </nav>
      <button class="mobile-menu" id="mobileMenu" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    </header>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <nav id="primaryNav" aria-label="Design system"></nav>
        <div class="sidebar-foot"><span class="status-dot"></span><span>GitHub source synced</span></div>
      </aside>
      <main id="main" tabindex="-1"><div class="loading">Loading design system…</div></main>
    </div>

    <dialog id="searchDialog" class="search-dialog">
      <form method="dialog" class="search-box">
        <label for="searchInput">Search AH Design System</label>
        <div class="search-input-row"><span aria-hidden="true">⌕</span><input id="searchInput" autocomplete="off" placeholder="Try “button”, “spacing”, or “QA”" /><button aria-label="Close search">Esc</button></div>
        <div id="searchResults" class="search-results" aria-live="polite"></div>
      </form>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
